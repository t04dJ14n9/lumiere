<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* VS Code adds these defaults to every webview (webview/browser/pre/index.html). */
      @layer vscode-default {
        body {
          margin: 0;
          padding: 0 20px;
        }
        img,
        video {
          max-width: 100%;
          max-height: 100%;
        }
        a:focus,
        input:focus {
          outline: 1px solid -webkit-focus-ring-color;
          outline-offset: -1px;
        }
      }
    </style>
    <link rel="stylesheet" href="/dist/webview/viewer.css" />
    <title>PDF viewer test harness</title>
  </head>
  <body>
    <div id="root" data-pdfium-wasm="/dist/webview/pdfium.wasm"></div>
    <script>
      // Stand in for VS Code: record what the viewer sends and answer `ready`
      // with the PDF named in ?pdf= (and, with ?goto=, a location right away).
      // ?toolbar= is the toolbar setting; the tests default to the slim bar,
      // whose fields and buttons most of them drive. ?dock= is the floating
      // bar's edge.
      const parameters = new URLSearchParams(location.search);
      document.getElementById("root").dataset.toolbar =
        parameters.get("toolbar") ?? "slim";
      document.getElementById("root").dataset.dock =
        parameters.get("dock") ?? "bottom";
      const viewSettings = JSON.parse(parameters.get("view") ?? "{}");
      let savedPosition = parameters.get("position")
        ? JSON.parse(parameters.get("position"))
        : undefined;
      if (parameters.has("persist"))
        savedPosition =
          JSON.parse(localStorage.getItem("pdf-view") ?? "null") ??
          savedPosition;
      window.__messages = [];
      // Like the extension, number each load sent to the viewer.
      let loads = 0;
      window.hostSend = (message) =>
        window.postMessage(
          message?.type === "load" ? { load: ++loads, ...message } : message,
          "*",
        );
      window.acquireVsCodeApi = () => ({
        postMessage(message) {
          window.__messages.push(message);
          const view = message.patch?.view;
          if (view && parameters.has("persist")) {
            const {
              readingPage: page,
              top,
              left,
              pageLayout,
              scrollMode,
              scrollDirection,
              zoom,
            } = view;
            localStorage.setItem(
              "pdf-view",
              JSON.stringify({
                page,
                top,
                left,
                pageLayout,
                scrollMode,
                scrollDirection,
                zoom,
              }),
            );
          }
          if (message.type !== "ready") return;
          fetch("/fixtures/" + (parameters.get("pdf") ?? "outline.pdf"))
            .then((response) => response.arrayBuffer())
            .then((data) => {
              window.hostSend({
                type: "load",
                data,
                settings: viewSettings,
                position: savedPosition,
              });
              const goto = parameters.get("goto");
              if (goto)
                window.hostSend({ type: "goTo", location: JSON.parse(goto) });
            });
        },
      });
    </script>
    <script src="/dist/webview/viewer.js"></script>
  </body>
</html>
