name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The real-VS Code specs (test/vscode, `pnpm test:vscode`) do not run here: they
# are flaky under load. They are a required local pre-push check, see README.

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: pnpm check (format, lint, typecheck, unit tests, contributions)
        run: pnpm check

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium and its system dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium's system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: pnpm test:browser
        run: pnpm test:browser
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Scroll smoothness and opening speed (packages/markdown/test/quality): a
  # merge gate. Timing budgets stretch with the runner's measured speed.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium and its system dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium's system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: pnpm test:quality
        run: pnpm test:quality
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality
          path: packages/markdown/test-results/
          retention-days: 30
          if-no-files-found: ignore

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: pnpm package
        run: pnpm package
      - name: Committed files are unchanged by packaging
        run: git diff --exit-code
      - name: Check the VSIX size and file list
        run: bash .github/scripts/check-vsix.sh "$(ls *.vsix)" 20
      - name: Bundle size report (job summary, warns on growth over 10%)
        run: node scripts/bundle-size.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          retention-days: 14
          if-no-files-found: error

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
      - name: Scan the full git history
        run: ./gitleaks git --redact --no-banner --verbose .

  audit:
    # Advisory only: reports known vulnerabilities in production dependencies
    # as a warning and never fails the build.
    name: audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: pnpm audit --prod
        run: |
          if pnpm audit --prod > audit.txt 2>&1; then
            cat audit.txt
          else
            cat audit.txt
            echo "::warning title=pnpm audit::$(tail -n 2 audit.txt | tr '\n' ' ')"
          fi
          { echo '### pnpm audit --prod'; echo '```'; tail -n 3 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
