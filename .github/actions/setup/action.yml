name: Set up Node.js and pnpm
description: >-
  Node.js 22 (the version @types/node targets), pnpm from the packageManager
  field through corepack, a cached pnpm store and a frozen-lockfile install.
inputs:
  install:
    description: Run pnpm install --frozen-lockfile.
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        package-manager-cache: false
    - name: Enable pnpm through corepack
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      run: |
        corepack enable
        pnpm --version
    - name: Locate the pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
